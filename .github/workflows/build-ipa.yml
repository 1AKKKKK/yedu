name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: 生成项目
        run: xcodegen generate

      - name: 构建（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Yedu.xcodeproj \
            -scheme Yedu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1 || true
          echo "=== ERRORS START ==="
          grep -n -E "error:|cannot find|does not conform|extra argument|missing argument|no exact matches" build.log | head -80 || true
          echo "=== ERRORS END ==="
          tail -25 build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: 打包 IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload Yedu.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/*.app/_CodeSignature
          zip -qry Yedu.ipa Payload
          ls -lh Yedu.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Yedu-unsigned-ipa
          path: Yedu.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
